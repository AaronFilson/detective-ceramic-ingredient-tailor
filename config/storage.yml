test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# AWS S3 object storage for hosted multi-user deployments (set ACTIVE_STORAGE_SERVICE=amazon).
# Uses scoped IAM credentials from SSM / .kamal/secrets when AWS_ACCESS_KEY_ID is set
# (required when EC2 IMDSv2 httpPutResponseHopLimit=1 blocks container metadata access),
# falling back cleanly to IAM instance/task roles otherwise.
amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "us-west-2") %>
  bucket: <%= ENV["AWS_S3_BUCKET"] %>
<% if ENV["AWS_ACCESS_KEY_ID"].present? %>
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
<% end %>
  public: false
  upload:
    server_side_encryption: AES256
