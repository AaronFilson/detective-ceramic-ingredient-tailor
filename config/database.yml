default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: public
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "ceramic_platform_development") %>

test:
  <<: *default
  database: ceramic_platform_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "ceramic_platform_production") %>
