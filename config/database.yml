default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: public
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "ceramic_platform_development") %>

test:
  <<: *default
  database: ceramic_platform_test

production:
  <<: *default
<% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"].sub(/\Apostgres(?:ql)?:\/\//, "postgis://") %>
<% else %>
  database: <%= ENV.fetch("POSTGRES_DB", "dci_tailor_production") %>
<% end %>
  max_connections: <%= ENV.fetch("DB_POOL") { [ ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("JOB_THREADS", 1).to_i + 4, 7 ].max } %>
