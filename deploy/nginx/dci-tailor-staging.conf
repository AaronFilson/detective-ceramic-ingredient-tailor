# DCI Tailor staging over HTTPS on the shared glazecalc EC2 host.
# Installed as /etc/nginx/sites-available/dci-tailor-staging and symlinked into /etc/nginx/sites-enabled/.
#   http://dci-tailor-staging.glazecalcapp.com  -> https://dci-tailor-staging.glazecalcapp.com (except ACME checks)
#   https://dci-tailor-staging.glazecalcapp.com -> shared kamal-proxy on 127.0.0.1:3002 (routed by Host header)

log_format dci_tailor_staging '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name dci-tailor-staging.glazecalcapp.com;
    access_log /var/log/nginx/dci-tailor-staging-access.log dci_tailor_staging;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dci-tailor-staging.glazecalcapp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dci-tailor-staging.glazecalcapp.com;
    access_log /var/log/nginx/dci-tailor-staging-access.log dci_tailor_staging;

    ssl_certificate /etc/letsencrypt/live/dci-tailor-staging.glazecalcapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dci-tailor-staging.glazecalcapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:dci_tailor_staging_tls:2m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml application/manifest+json text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Forwarded "";
        proxy_hide_header X-Robots-Tag;
    }

    error_page 502 504 =503 @stopped;
    location @stopped {
        default_type text/plain;
        return 503 "The staging copy of DCI Tailor is not running right now: it is stopped, or a new version is starting. Try again in a minute.\n";
    }
}
